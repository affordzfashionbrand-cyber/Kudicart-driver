<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>KudiCart Driver App Preview</title>
  <style>
    /* Reset and ensure full height */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Mobile viewport simulation wrapper */
    #root {
      width: 100%;
      height: 100%;
      max-width: 414px; /* iPhone Max width */
      max-height: 896px;
      background-color: #ffffff;
      box-shadow: 0px 4px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    /* Ensure the React Native Web app mounts cleanly */
    #root > div {
      flex: 1;
      display: flex;
    }
    
    @media (min-width: 415px) {
      #root {
        height: 90vh;
        border-radius: 20px;
        border: 4px solid #333;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.web.js"></script>
</body>
</html>
