<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>KudiCart Driver App Preview</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // Firebase Phone Auth strictly validates domain credentials. On Windows, localhost can resolve to IPv6 (::1)
    // causing auth/invalid-app-credential. Using literal 127.0.0.1 guarantees IPv4 matching Firebase Authorized Domains.
    if (window.location.hostname !== '127.0.0.1' && !window.location.hostname.endsWith('firebaseapp.com') && !window.location.hostname.endsWith('web.app')) {
      var target = 'http://127.0.0.1:' + (window.location.port || '3002') + window.location.pathname + window.location.search + window.location.hash;
      console.warn('[Firebase Auth] Redirecting to 127.0.0.1 for authentic Phone Auth: ' + target);
      window.location.replace(target);
    }
  </script>
  <style>
    .leaflet-container {
      width: 100% !important;
      height: 100% !important;
      background: #F3F1EC !important;
      font-family: inherit;
    }
    .kudi-map-marker,
    .kudi-driver-marker,
    .kudi-dest-marker {
      background: transparent !important;
      border: none !important;
    }
    /* Reset and ensure full height */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Mobile viewport simulation wrapper */
    #root {
      width: 100%;
      height: 100%;
      max-width: 414px; /* iPhone Max width */
      max-height: 896px;
      background-color: #ffffff;
      box-shadow: 0px 4px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    /* Ensure the React Native Web app and NavigationContainer mount cleanly */
    #root > div {
      flex: 1;
      display: flex;
    }
    
    @media (min-width: 415px) {
      #root {
        height: 90vh;
        border-radius: 20px;
        border: 4px solid #333;
      }
    }

    #recaptcha-container {
      position: fixed !important;
      bottom: 16px !important;
      right: 16px !important;
      z-index: 2147483647 !important;
    }

    /* Constrain React Native Web modals to mobile frame without displacing #root, ignoring Google reCAPTCHA dialogs */
    body > div[aria-modal="true"]:not([style*="2000000000"]):not([style*="2147483647"]) {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      max-width: 414px !important;
      margin: 0 auto !important;
      pointer-events: none !important;
      z-index: 99999 !important;
    }
    body > div[aria-modal="true"]:not([style*="2000000000"]):not([style*="2147483647"]) > * {
      pointer-events: auto !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="recaptcha-container"></div>
  <script type="module" src="/index.web.js"></script>
</body>
</html>
